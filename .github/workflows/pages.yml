name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Named here rather than inherited from the committed .env, because
          # what it selects is what the published page answers with. `mock`
          # serves the contract's own example bodies from a service worker in
          # the tab: the pages work end to end and the findings are examples,
          # not an analysis of what the visitor brought. Point this at `stand`
          # with an API origin the day one answers.
          NEXT_PUBLIC_API_SOURCE: mock
        run: npm run build
      # Two files the build writes for a host that reads them, and GitHub Pages
      # is not one: it serves files and takes no configuration from them. Left
      # in, they are two publicly readable descriptions of the policy - which
      # addresses are allowed, where violations are posted, where it is relaxed
      # - answering a question nobody could otherwise ask of this deployment.
      # They stay in `out/` for every other host and for the header smoke test;
      # they are dropped from what is published here.
      - name: Drop the files this host does not read
        run: rm -f out/_headers out/security-headers.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
