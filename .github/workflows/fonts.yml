# The fonts live in this repository and the build reads them off the disk, so a
# release never depends on a font host being up, and a family withdrawn upstream
# cannot take a deploy with it.
#
# Keeping them current is this job's work instead. It runs weekly, fetches the
# newest release of each family, and opens a pull request when anything moved -
# so the update arrives on its own, but as a reviewed diff rather than as
# something that happened during a build.
#
# Two things this needs from the repository settings, and it fails loudly
# without them: Settings -> Actions -> General -> "Allow GitHub Actions to
# create and approve pull requests".
name: fonts

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Fetch the current release of each family
        run: npm run fonts

      - name: Has anything moved
        id: moved
        run: |
          if git diff --quiet -- public/fonts src/app/fonts.css; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fonts are already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A pull request opened with GITHUB_TOKEN does not start the workflows
      # that run `on: pull_request` - GitHub blocks that to stop a workflow
      # triggering itself. So the checks a font change can actually break are
      # run here, before the pull request exists; without this the update would
      # arrive with a green tick that nothing put there.
      - name: The build still works and the budgets still hold
        if: steps.moved.outputs.changed == 'true'
        run: |
          npm run build
          npm run size

      - name: Open a pull request
        if: steps.moved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The versions are in the generated stylesheet's header, which makes
          # the pull request title say what actually changed.
          versions=$(sed -n 's/^ \* Sources: //p' src/app/fonts.css)
          branch="fonts/$(date -u +%Y-%m-%d-%H%M)"

          # `gh pr create --label` fails outright on a label the repository does
          # not have, which would throw away the whole run over a piece of
          # decoration.
          gh label create dependencies --color ededed --force >/dev/null 2>&1 || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/fonts src/app/fonts.css
          git commit -m "Update the vendored fonts to ${versions}"
          git push --set-upstream origin "$branch"

          gh pr create \
            --title "Update the vendored fonts" \
            --label dependencies \
            --body "$(printf '%s\n' \
              "Upstream now publishes ${versions}." \
              "" \
              "The files in \`public/fonts\` and the \`@font-face\` rules in" \
              "\`src/app/fonts.css\` were regenerated by \`npm run fonts\`." \
              "" \
              "The build and the bundle budgets were run on this branch before" \
              "the pull request was opened, because a pull request opened by a" \
              "workflow does not start the ones that watch pull requests." \
              "" \
              "A face's metrics can change between releases, so give the pages a" \
              "look before merging - that is what this pull request exists for.")"
