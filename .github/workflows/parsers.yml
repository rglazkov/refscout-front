# A separate trigger: updating the parsers or the editor forces the expensive
# tests to run, even for a patch version.
name: parsers

on:
  pull_request:
    paths:
      - package-lock.json
      - package.json

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Are the parsers affected
        id: touched
        run: |
          if git diff HEAD^ HEAD -- package.json package-lock.json |
             grep -qE '"(pdfjs-dist|codemirror|@codemirror/[a-z-]+|citation-js|@unified-latex/[a-z-]+|mammoth|turndown|@joplin/turndown-plugin-gfm|@mixmark-io/domino|fflate|markdown-it|html-to-docx)"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.touched.outputs.run == 'true'
        run: npm ci
      - if: steps.touched.outputs.run == 'true'
        run: npm run build
      - if: steps.touched.outputs.run == 'true'
        name: Browsers
        # Both engines the suite declares, as in the nightly lane.
        run: npx playwright install --with-deps chromium firefox
      - if: steps.touched.outputs.run == 'true'
        # `npm run build` above has already run the corpus - it is part of the
        # fast tests - so what is left here is the browser lane, where the
        # workers actually start and pdf.js actually fetches its character maps.
        # The editor tests join it when they are written.
        run: npx playwright test
